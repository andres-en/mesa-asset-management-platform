# Full stack (PostgreSQL + Flask API + Next.js frontend), ready to deploy.
# Copy .env.example to .env in this folder and adjust the values first.
#
# Usage:
#   docker compose build
#   docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      POSTGRES_DB: ${POSTGRES_DB:-mesa}
    volumes:
      - mesa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5433}:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mesa}:${POSTGRES_PASSWORD:-mesa}@db:5432/${POSTGRES_DB:-mesa}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SIGNING_BASE_URL: ${SIGNING_BASE_URL:-http://localhost:3000/firmar}
      SIGNATURE_TOKEN_EXPIRATION_HOURS: ${SIGNATURE_TOKEN_EXPIRATION_HOURS:-48}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mesa_uploads:/app/uploads
    ports:
      - "${WEB_PORT:-5000}:5000"

  frontend:
    build:
      context: ./my-app
      args:
        # Baked into the bundle at build time: must be a URL reachable from the
        # user's browser, not the Docker service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_ENABLE_DEV_LOGIN: ${NEXT_PUBLIC_ENABLE_DEV_LOGIN:-false}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mesa_db_data:
  mesa_uploads:
