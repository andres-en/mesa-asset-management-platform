# Stack solo-backend para desarrollo local (hot-reload de migrations/uploads
# vía bind mounts). Para el stack completo (+ frontend) listo para desplegar,
# usa el docker-compose.yml en la raíz del proyecto.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa}
      POSTGRES_DB: ${POSTGRES_DB:-mesa}
    volumes:
      - mesa_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5433}:5432"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mesa}:${POSTGRES_PASSWORD:-mesa}@db:5432/${POSTGRES_DB:-mesa}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./migrations:/app/migrations
    ports:
      - "${WEB_PORT:-5050}:5000"

volumes:
  mesa_db_data:
